[project]
name = "pc"
version = "0.0.0"
description = "Pipeline Puissance de calcul : open data système électrique, réseau, météo, data centers → data/export/"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "polars>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
pc = "pc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "donnees: tests sur les données produites (data/export/), sautés si elles sont absentes",
]
addopts = "-ra"
