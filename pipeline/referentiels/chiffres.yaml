  ue_correlation_seuil_prix:
    libelle: Prix day-ahead en dessous duquel la corrélation temporelle est toujours réputée respectée (carburants renouvelables d'origine non biologique)
    valeur: 20
    unite: €/MWh
    grandeur: prix
    periode: règle du règlement 2023/1184, article 6 dans sa rédaction issue du règlement 2024/1408 (JO du 21/05/2024)
    perimetre: "prix d'équilibre du couplage unique journalier dans la zone de dépôt des offres, sur une période d'une heure ; alternative : moins de 0,36 fois le prix d'un quota de CO2"
    source: ue-2024-1408
    page: article 1er, point 7 (nouvel article 6 du règlement 2023/1184), p. 4/5
    citation: "« Jusqu'au 31 décembre 2029, la condition de corrélation temporelle visée à l'article 4, paragraphes 2 et 4, est réputée respectée si le carburant renouvelable d'origine non biologique est produit au cours du même mois civil que l'électricité renouvelable produite dans le cadre de l'accord d'achat d'électricité renouvelable […]. À partir du 1er janvier 2030, la condition de corrélation temporelle est réputée respectée si le carburant renouvelable d'origine non biologique est produit au cours de la même période d'une heure que l'électricité renouvelable produite dans le cadre de l'accord d'achat d'électricité renouvelable […]. La condition de corrélation temporelle est toujours réputée respectée si le carburant renouvelable d'origine non biologique est produit au cours d'une période d'une heure, lorsque le prix d'équilibre de l'électricité résultant du couplage unique journalier dans la zone de dépôt des offres, tel que visé à l'article 39, paragraphe 2, point a), du règlement (UE) 2015/1222 de la Commission, est inférieur ou égal à 20 EUR par MWh ou inférieur à 0,36 fois le prix d'un quota d'émission d'une tonne d'équivalent-dioxyde de carbone au cours de la période considérée aux fins de satisfaire aux exigences de la directive 2003/87/CE du Parlement européen et du Conseil. »"
    confiance: B
    verification: contre-verification
    note: "les coupures […] retirent les variantes de stockage et la faculté pour les États membres d'avancer la règle horaire au 1er juillet 2027 ; texte identique en substance à la version de 2023 (ue-2023-1184, JO L 157/17), seul le terme « carburant » change ; règle de prix, pas une mesure d'émissions"

  ue_correlation_coef_quota:
    libelle: Coefficient appliqué au prix d'un quota de CO2 (€/t) pour obtenir le seuil alternatif de prix (€/MWh) de la corrélation temporelle (carburants renouvelables d'origine non biologique)
    valeur: 0.36
    unite: fois
    precision: 0.01
    grandeur: coefficient_reglementaire
    periode: même règle que ue_correlation_seuil_prix
    perimetre: le prix day-ahead de l'heure doit être inférieur à ce coefficient multiplié par le prix d'un quota d'émission d'une tonne d'équivalent CO2 (€/MWh contre €/t)
    source: ue-2024-1408
    page: article 1er, point 7 (nouvel article 6 du règlement 2023/1184), p. 4/5
    citation: "« […] est inférieur ou égal à 20 EUR par MWh ou inférieur à 0,36 fois le prix d'un quota d'émission d'une tonne d'équivalent-dioxyde de carbone au cours de la période considérée […] »"
    confiance: B
