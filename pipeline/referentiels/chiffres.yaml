    citation: "« Pour évaluer les émissions évitées, il est possible de comparer, pour chaque heure, l'intensité de la production française avec celle des pays vers lesquelles l'électricité est exportée. Les émissions évitées sont ainsi fonction, d'une part, du différentiel d'intensité carbone entre les mix de production de la France et des autres pays, et d'autre part de la quantité d'électricité exportée. Une telle approche implique nécessairement des simplifications, et néglige certains phénomènes propres au fonctionnement du système électrique : en particulier, il n'est pas tenu compte de l'effet qu'aurait une modification des échanges sur l'ordre de préséance économique dans chaque pays. Cela étant, l'analyse des émissions évitées ainsi calculées permet tout de même de dégager des tendances, notamment dans le temps et dans la répartition géographique. » ; même page : « En 2025, les exportations de la France ont permis d'éviter l'émission près de 27 MtCO2éq en Europe, dont près de la moitié ont été évitées en Italie, et un cinquième en Allemagne. »"
