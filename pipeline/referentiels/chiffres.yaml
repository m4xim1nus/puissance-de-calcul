    valeur: 48.5
    unite: GW
    grandeur: disponibilite_moyenne
    periode: novembre 2026 - mars 2027
    perimetre: parc nucléaire français ; prévision de RTE, disponibilité lissée sur 7 jours ; EPR de Flamanville 3 à l'arrêt tout l'hiver
