  # ------------------------------------------- « Quand ? » : chiffres cités
  # Citations relues à la source par la contre-vérification du 26/11/2026
  # (docs/spike/quand-contre-verification.md), revérifiées dans les PDF locaux.
  # Les chiffres calculés de « Quand ? » (quand_*) ne sont pas ici : `pc build`
  # les produit dans chiffres.json (pc/export_quand.py).

  marge_rte_hiver_2026_2027:
    libelle: Marges de sécurité d'approvisionnement prévues pour l'hiver 2026-2027
    valeur: [8, 10]
    unite: GW
    grandeur: marge_adequation
    periode: hiver 2026-2027
    perimetre: France ; marge en capacité équivalente par rapport au critère public de sécurité d'approvisionnement (espérance de défaillance de 3 h par an), calcul probabiliste ; selon la consommation, le rythme des EnR et la disponibilité nucléaire
    source: rte-bp2025-fonctionnement
    page: p. 13
    citation: « le niveau de marges pour l'hiver 2026-2027 est évalué entre 8 et 10 GW par rapport au critère public de sécurité d'approvisionnement, et varie en fonction de la dynamique d'évolution de la consommation, des rythmes de développement des énergies renouvelables et de la disponibilité du parc nucléaire »
    confiance: B
    recoupements:
      - source: rte-bp2025-resultats
        valeur: « celles-ci se maintiendront autour de 8 à 10 GW par rapport au critère public de sécurité d'approvisionnement » (p. 15)
        note: même éditeur, même exercice
        independant: false
    verification: contre-verification
    note: évaluées avec les hypothèses du Bilan prévisionnel 2025, donc avant la synthèse de l'hiver 2026-2027 (novembre 2026), qui ne redonne aucune marge en GW (risque « significativement en dessous du critère », p. 15) et prévoit une disponibilité nucléaire plus basse ; pas un excédent de puissance observable à la pointe

  marge_mc_certifiee_2026_2027:
    libelle: Marge retenue pour dimensionner le besoin du mécanisme de capacité (scénario retenu)
    valeur: 9.5
    unite: GW
    grandeur: marge_certifiee
    periode: période de livraison 2026-2027
    perimetre: GW certifiés au sens du mécanisme de capacité, scénario « décarbonation lente » (8,0 GW dans le scénario « décarbonation rapide ») ; ne se compare pas directement aux marges du Bilan prévisionnel
    source: rte-parametrage-mc-2026
    page: p. 10, tableau 5
    citation: "« Tableau 5 : Valeurs de marge dans les scénarios de dimensionnement » ; colonne « Marge utilisée pour Cref » : « Décarbonation lente 9,5 GW »"
    confiance: B
    recoupements:
      - source: rte-enchere-mc-2026
        valeur: volume Cref arrêté de 79 000 MW (p. 9), soit la valeur du scénario lent (figure 4 du paramétrage, p. 12)
        note: même éditeur ; confirme le scénario retenu, pas la marge
        independant: false
    verification: contre-verification
    note: rapport daté du 21/01/2026, version publiée le 12/02/2026 (modifiée après la saisine de la CRE ; non vérifié si les marges ont changé entre les deux versions) ; scénario lent retenu sur proposition de la CRE (délibération 2026-43 du 10/02/2026, p. 9)

