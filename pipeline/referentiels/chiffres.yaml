# Chiffres publiés sur le site, un par entrée. Rien n'est tapé à la main
# dans une page : le site lit data/export/chiffres.json, produit d'ici.
#
# Champs : libelle, valeur (nombre ou [min, max]), unite, grandeur (voir
# pc/chiffres.py, UNITES), periode, perimetre, source (clé de
# sources.yaml), page, citation (passage exact), confiance (A/B/C),
# recoupements (liste {source, valeur, note, independant}), calcul (si
# le site dérive le chiffre), verification (« contre-verification » si
# le passage a été relu à la source par un second agent, sinon « spike »),
# note.
#
# Chiffres calculés : les identifiants `quand_*` ne sont PAS saisis ici. `pc
# build` les calcule (pc/export_quand.py) et les ajoute à chiffres.json avec
# le même schéma, plus `produit_par: pc build` (qui impose `calcul`),
# `verification: pc check` et la source `pdc-quand` (data/export/quand.json,
# datée de la dernière extraction des données). Un identifiant calculé qui
# existerait déjà ici fait échouer le build.
#
# Confiance : A = source primaire + recoupement indépendant (autre
# éditeur, autre méthode) ; B = source primaire, sans recoupement
# indépendant (recoupement de même origine, ou aucun) ; C = source
# secondaire, ou grandeur mal définie par la source.

chiffres:

  # ---------------------------------------------------------------- énergie
  conso_brute_france_2024:
    libelle: Consommation brute d'électricité en France
    valeur: 442.2
    unite: TWh
    grandeur: energie
    periode: "2024"
    perimetre: France métropolitaine, Corse comprise, pertes incluses, pompage exclu
    source: rte-be2024
    page: p. 12
    citation: « La consommation brute d'électricité de l'année 2024 s'est élevée à 442,2 TWh »
    confiance: B
    recoupements:
      - source: rte-eco2mix-odre
        valeur: 440,0 TWh (somme éCO2mix, hors Corse) + 2,3 TWh (Corse, ODRÉ)
        note: recalcul du site ; même éditeur, mais données horaires distinctes du bilan publié
        independant: false
    verification: contre-verification
    note: révisé à 442,3 TWh dans ODRÉ (recalcul de l'autoconsommation photovoltaïque)

  dc_conso_sites_dedies_2024:
