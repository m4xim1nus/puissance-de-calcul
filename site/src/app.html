<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Aperçu des liens partagés (WhatsApp, Signal, réseaux) : image figée du calendrier des prix 2025. -->
    <meta property="og:site_name" content="Puissance de calcul" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Puissance de calcul" />
    <meta
      property="og:description"
      content="Le système électrique français peut-il accueillir la vague de data centers, et à quelles conditions ? Données publiques, sourcées et datées."
    />
    <meta property="og:image" content="https://pdc.technoperchoir.fr/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Le titre du site à gauche ; à droite, le calendrier des prix de gros day-ahead en France en 2025, une ligne par jour, une colonne par heure."
    />
    <meta name="twitter:card" content="summary_large_image" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
